# yaml-language-server: $schema=https://unpkg.com/undocs/schema/config.json
name: unstorage
shortDescription: Universal Key-Value.
description: Unified key-value storage API with conventional features and 20+ built-in drivers.
github: unjs/unstorage
themeColor: amber
url: https://unstorage.unjs.io
socials:
  twitter: "https://twitter.com/unjsio"
  bluesky: "https://bsky.app/profile/unjs.io"
sponsors:
  api: https://sponsors.pi0.io/sponsors.json
redirects:
  "/usage": "/guide"
  "/utils": "/guide/utils"
  "/http-server": "/guide/http-server"
  "/custom-driver": "/guide/custom-driver"
  "/drivers/azure-app-configuration": "/drivers/azure"
  "/drivers/azure-cosmos": "/drivers/azure"
  "/drivers/azure-key-vault": "/drivers/azure"
  "/drivers/azure-storage-block": "/drivers/azure"
  "/drivers/azure-storage-blob": "/drivers/azure"
  "/drivers/azure-storage-table": "/drivers/azure"
  "/drivers/cloudflare-kv-binding": "/drivers/cloudflare"
  "/drivers/cloudflare-kv-http": "/drivers/cloudflare"
  "/drivers/cloudflare-r2-binding": "/drivers/cloudflare"
  "/drivers/netlify-blobs": "/drivers/netlify"
  "/drivers/localstorage": "/drivers/browser"
  "/drivers/indexedb": "/drivers/browser"
  "/drivers/session-storage": "/drivers/browser"
landing:
  contributors: true
  featuresTitle: A simple, small, and fast key-value storage library for JavaScript.
  features:
    - title: "Runtime Agnostic"
      description: "Your code will work on any JavaScript runtime including Node.js, Bun, Deno and Workers."
      icon: "i-material-symbols-lock-open-right-outline-rounded"
    - title: "Built-in drivers"
      description: "Choose from 30+ drivers for memory, filesystems, browsers, databases, and cloud platforms."
      icon: "i-material-symbols-usb"
    - title: "Snapshots"
      description: "Export and restore storage contents with plain JavaScript objects."
      icon: "i-material-symbols-add-a-photo-outline"
    - title: "Multiple storages"
      description: "Mount different drivers under key prefixes and access them through one storage instance."
      icon: "i-material-symbols-view-list-outline"
    - title: "JSON-friendly"
      description: "Unstorage automatically serializes and deserializes JSON values."
      icon: "i-material-symbols-magic-button"
    - title: "Binary support"
      description: "Store binary and raw data like images, videos, audio files, etc."
      icon: "i-material-symbols-audio-file"
